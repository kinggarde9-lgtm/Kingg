<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarhang Gardi | VIP Links</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=NRT:wght@400;700&family=Poppins:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'NRT', sans-serif;
        }

        body {
            background: #05050a;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(120, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 242, 254, 0.15) 0%, transparent 40%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .card {
            background: rgba(20, 20, 35, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 30px 20px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 
                        0 0 40px rgba(120, 0, 255, 0.1);
            animation: fadeIn 1s ease-in-out;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* وێنەی پڕۆفایل بە لێواری ڕووناک */
        .profile-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 15px auto;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fffc00;
            box-shadow: 0 0 20px rgba(255, 252, 0, 0.4);
        }

        .profile-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #00f2fe, #4facfe, #fffc00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .profile-subtitle {
            font-size: 13px;
            color: #b0b0c3;
            margin-bottom: 20px;
        }

        /* بەشی هاکی پับجی (ڕاقی و مۆدێرن) */
        .pubg-box {
            background: linear-gradient(135deg, rgba(255, 140, 0, 0.1), rgba(255, 60, 0, 0.05));
            border: 1px solid rgba(255, 140, 0, 0.3);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 15px rgba(255, 140, 0, 0.05);
        }

        .pubg-box h3 {
            font-size: 15px;
            color: #ffaa00;
            margin-bottom: 8px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .pubg-box p {
            font-size: 12px;
            color: #ccc;
            margin-bottom: 12px;
        }

        .tags-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 170, 0, 0.2);
            padding: 6px;
            border-radius: 8px;
            font-size: 11px;
            color: #ffcc66;
            font-weight: 600;
            text-align: center;
            transition: 0.3s;
        }

        .tag:hover {
            background: rgba(255, 170, 0, 0.15);
            border-color: #ffaa00;
        }

        /* دوگمەکان */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .snapchat {
            background: #FFFC00;
            color: #000;
            box-shadow: 0 5px 20px rgba(255, 252, 0, 0.25);
        }

        .snapchat:hover {
            background: #e6e300;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 252, 0, 0.4);
        }

        .telegram {
            background: linear-gradient(135deg, #0088cc, #00a2ff);
            color: #fff;
            box-shadow: 0 5px 20px rgba(0, 136, 204, 0.3);
        }

        .telegram:hover {
            background: linear-gradient(135deg, #0077b5, #0090e0);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 136, 204, 0.5);
        }

        .footer {
            margin-top: 15px;
            font-size: 11px;
            color: #666;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="card">

        <div class="profile-container">
            <img src="https://i.ibb.co/vxwC61Sk/IMG-20260729-072220-399.jpg" alt="Sarhang Gardi" class="profile-img">
        </div>
        
        <div class="profile-title">Sarhang Gardi</div>
        <div class="profile-subtitle">Official VIP Links & Services</div>

        <!-- بەشی ڕیکلامی هەکی پับجی (ڕاقتر و ڕێکخراوتر) -->
        <div class="pubg-box">
            <h3>⚡ کڕین و فرۆشتنی های ڤیپ ⚡</h3>
            <p>بەردەستە بۆ هەموو ئامێرەکان بە باشترین ئەنتی بان:</p>
            <div class="tags-grid">
                <span class="tag">🔥 PUBG Root</span>
                <span class="tag">🛡️ PUBG No Root</span>
                <span class="tag">🍏 iOS Hack</span>
                <span class="tag">🤖 Android Hack</span>
            </div>
        </div>

        <!-- دوگمەی سناپچات -->
        <a href="https://www.snapchat.com/add/sarhang_gardi2?share_id=BAfDiNMjQig&locale=en-US" target="_blank" class="btn snapchat">
            <span>سناپچاتەکەم (Snapchat)</span>
        </a>

        <!-- دوگمەی تێلیگرام -->
        <a href="https://t.me/sarhang_mod_vip" target="_blank" class="btn telegram">
            <span>کەناڵی تێلیگرام (Telegram)</span>
        </a>

        <div class="footer">SARHANG MOD VIP &copy; 2026</div>
    </div>

</body>
</html>
