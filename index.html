<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarhang Gardi - Links</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }
        .profile-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fffc00;
            margin-bottom: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .profile-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #0088cc, #fffc00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .profile-subtitle {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 18px;
        }
        /* باکگراوند و بەشی چاتی ڕیکلامی پับجی */
        .pubg-notice {
            background: linear-gradient(135deg, rgba(255, 152, 0, 0.15), rgba(244, 67, 54, 0.15));
            border: 1px solid rgba(255, 152, 0, 0.4);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 18px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .pubg-notice h3 {
            font-size: 15px;
            color: #ff9800;
            margin-bottom: 6px;
            font-weight: bold;
        }
        .pubg-notice p {
            font-size: 12px;
            color: #ddd;
            line-height: 1.5;
        }
        .badges {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            color: #fffc00;
            border: 1px solid rgba(255, 252, 0, 0.2);
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 13px;
            margin-bottom: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .snapchat {
            background-color: #FFFC00;
            color: #000;
        }
        .snapchat:hover {
            background-color: #e5e200;
            transform: translateY(-3px);
        }
        .telegram {
            background-color: #0088cc;
        }
        .telegram:hover {
            background-color: #0077b5;
            transform: translateY(-3px);
        }
        .footer {
            margin-top: 15px;
            font-size: 11px;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- وێنەی پڕۆفایل -->
        <img src="https://i.ibb.co/vxwC61Sk/IMG-20260729-072220-399.jpg" alt="Profile Image" class="profile-img">
        
        <div class="profile-title">Sarhang Gardi</div>
        <div class="profile-subtitle">سەردانی تۆڕە کۆمەڵایەتییەکانم بکە 👇</div>

        <!-- بەشی ڕیکلامی هەکی پับجی -->
        <div class="pubg-notice">
            <h3>🔥 کڕین و فرۆشتنی هاك PUBG 🔥</h3>
            <p>هاکی تایبەت بەردەستە بە باشترین کوالێتی و ئەنتی بان:</p>
            <div class="badges">
                <span class="badge">Root</span>
                <span class="badge">No Root</span>
                <span class="badge">iOS</span>
                <span class="badge">Android</span>
            </div>
        </div>

        <!-- سناپچات -->
        <a href="https://www.snapchat.com/add/sarhang_gardi2?share_id=BAfDiNMjQig&locale=en-US" target="_blank" class="btn snapchat">
            <span>سناپچاتەکەم (Snapchat)</span>
        </a>

        <!-- تێلیگرام -->
        <a href="https://t.me/sarhang_mod_vip" target="_blank" class="btn telegram">
            <span>کەناڵی تێلیگرام (Telegram)</span>
        </a>

        <div class="footer">Sarhang MOD VIP &copy; 2026</div>
    </div>

</body>
</html>
